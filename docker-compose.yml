services:
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    # Enable user-defined functions (needed by the true_average aggregate), then start normally
    entrypoint: >
      bash -c "sed -i -E 's/^(user_defined_functions_enabled|enable_user_defined_functions):.*/\\1: true/' /etc/cassandra/cassandra.yaml
      && exec docker-entrypoint.sh cassandra -f"
    volumes:
      - ./data/processed:/data:ro
      - ./cassandra:/scripts:ro
    # Ready when cqlsh can connect (Cassandra takes 30-60 s to start)
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # Neo4j Browser: http://localhost:7474
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/movielens   # local demo password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - ./data/processed:/import:ro   # LOAD CSV reads file:/// from /import
      - ./neo4j:/scripts:ro
    # Ready when cypher-shell can run a query
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "movielens", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
